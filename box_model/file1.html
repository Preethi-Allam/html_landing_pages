<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        section{
            height: 500px;
            width: 500px;
            background-color: blueviolet;
            border-radius: 100%;
            margin: 50px auto;
            padding: 50px;
            box-sizing: border-box;
        }
        .circle1{
            height: 400px;
            width: 400px;
            background-color: hotpink;
            border-radius: 100%;
            margin: auto;
            padding: 50px;
            box-sizing: border-box;
        }
        .circle2{
            height: 300px;
            width: 300px;
            background-color: green;
            border-radius: 100%;
            margin: auto;
            padding: 50px;
            box-sizing: border-box;
        }
        .circle3{
            height: 200px;
            width: 200px;
            background-color: pink;
            border-radius: 100%;
            margin: auto;
            padding: 50px;
            box-sizing: border-box;
        }
        .circle4{
            height: 100px;
            width: 100px;
            background-color: brown;
            border-radius: 100%;
            margin: auto;
            padding: 50px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <section>
        <div class="circle1">
            <div class="circle2">
                <div class="circle3">
                    <div class="circle4"></div>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
