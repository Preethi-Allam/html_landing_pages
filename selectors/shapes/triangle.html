<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .cylinder {
            height: 400px;
            width: 200px;
            margin: 100px auto;
            border: 4px black solid;
            border-top: transparent;
            border-bottom: transparent;
        }

        .sub-cylinder {
            height: 20px;
            width: 194px;
            border: 4px black solid;
            border-radius: 50%;
            top: -12px;
            position: relative;
            align-items: center;
        }

        .sub-cylinder2 {
            align-items: center;
            margin-top: 356px;
            height: 26px;
            width: 193px;
            border: 4px black solid;
            border-radius: 50%;
            z-index: 1;
            position: relative;
            align-content: center;
            left: 0px;
            right: 0px;
        }
    </style>
</head>

<body>
    <div class="cylinder">
        <div class="sub-cylinder">
        </div>
        <div class="sub-cylinder2">

        </div>
    </div>
</body>

</html>
